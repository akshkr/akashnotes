name: Check lesson snippets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --strict: fail on unbalanced fences AND on any Python block that doesn't
      # parse. Intentional non-runnable blocks are marked with a `# fragment`
      # comment and skipped. Remove --strict only if fragment annotation lapses.
      - name: Check fences and parse Python blocks
        run: python tools/check_snippets.py --strict
